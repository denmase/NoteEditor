name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            JianpuEditor.sln
            **/*.csproj

      - name: Cache .NET build outputs
        uses: actions/cache@v6
        with:
          path: |
            JianpuEditor/obj
            JianpuEditor.Tests/obj
          key: ${{ runner.os }}-dotnet-build-${{ hashFiles('JianpuEditor.sln', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-build-

      - name: Restore
        run: dotnet restore JianpuEditor.sln

      - name: Check code format
        shell: pwsh
        run: ./scripts/check-format.ps1

      - name: Build Debug
        run: dotnet build JianpuEditor.sln -c Debug --no-restore

      - name: Build Release
        run: dotnet build JianpuEditor.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test JianpuEditor.sln -c Release --no-build --verbosity normal

      - name: MIDI export smoke test
        shell: pwsh
        run: ./scripts/test-midi-export.ps1

      - name: Upload Release build
        uses: actions/upload-artifact@v7
        with:
          name: JianpuEditor-${{ github.sha }}
          path: |
            JianpuEditor/bin/Release/net472/**
            !JianpuEditor/bin/Release/net472/**/*.pdb
          if-no-files-found: error
          retention-days: 14